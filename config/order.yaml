# Variant order per participant (A = natural language, B = graph,
# C = rule-based). Task assignment is by position: the 1st variant listed is
# shown with content set C1, the 2nd with C2, the 3rd with C3.
#
# ---------------------------------------------------------------------------
# The E-slot design: 18 slots, all 6 A/B/C permutations x 3 participants each
# ---------------------------------------------------------------------------
#
#   Slot   Order        First     Second    Third
#   E1     A -> B -> C  A (C1)    B (C2)    C (C3)
#   E2     B -> C -> A  B (C1)    C (C2)    A (C3)
#   E3     C -> A -> B  C (C1)    A (C2)    B (C3)
#   E4     A -> C -> B  A (C1)    C (C2)    B (C3)
#   E5     C -> B -> A  C (C1)    B (C2)    A (C3)
#   E6     B -> A -> C  B (C1)    A (C2)    C (C3)
#   E7-E12   second pass through the same six permutations, in the same order
#   E13-E18  third pass through the same six permutations, in the same order
#
# So each permutation owns three slots: A->B->C = E1/E7/E13,
# B->C->A = E2/E8/E14, C->A->B = E3/E9/E15, A->C->B = E4/E10/E16,
# C->B->A = E5/E11/E17, B->A->C = E6/E12/E18.
#
# This replaces the original 9-slot design, which used only the three cyclic
# rotations (A->B->C, B->C->A, C->A->B) with 3 participants each. The six
# participants who already ran did so under that old design, so their orders
# below are historical fact and must never change -- but all three of their
# orders are also slots in this design, so every one of them keeps a valid
# place in it.
#
# ---------------------------------------------------------------------------
# Slot occupancy -- 10 of 18 filled, 8 still to recruit
# ---------------------------------------------------------------------------
#
#   A -> B -> C   E1  P1   (ran -- Consulting Director)
#                 E7  P4   (ran -- LLM Engineer)
#                 E13 P7   (ran -- Product Strategist)          CELL FULL
#   B -> C -> A   E2  P2   (ran -- DevOps Engineer (AI Specialization))
#                 E8  P8   (ran -- Senior Functional Consultant)
#                 E14 P5   (returned -- Executive Director)      CELL FULL
#   C -> A -> B   E3  P3   (ran -- Senior Marketing Manager)
#                 E9  open
#                 E15 open
#   A -> C -> B   E4  P9   (scheduled -- Conservation Programme Manager)
#                 E10 open
#                 E16 open
#   C -> B -> A   E5  P10  (scheduled -- Monitoring and Evaluation Specialist)
#                 E11 open
#                 E17 open
#   B -> A -> C   E6  P11  (scheduled -- People Manager)
#                 E12 open
#                 E18 open
#
# At 3 per order there is no surplus: P1/P4/P7 fill the A->B->C cell exactly,
# so P7 holds E13 rather than sitting outside the design (which it would have
# under the earlier 12-slot/2-per-order variant).
#
# P9/P10/P11 were deliberately assigned the three orders nobody had run yet,
# so that after their sessions all six permutations have at least one
# participant.
#
# P5 withdrew before their session and later returned. Since they never ran,
# their order was never shown to anyone and nothing of theirs was frozen --
# keeping B -> C -> A fills E14 and completes that cell, and their course
# data was regenerated on the varied-filler structure.
#
# P6 dropped out before running and holds no slot. The entry below keeps the
# original (never-shown) order purely so the generator's output stays
# byte-identical for everyone else; P6 is excluded from the design.
#
# ---------------------------------------------------------------------------
# Still open
# ---------------------------------------------------------------------------
#  - Whether P7 and P8 stay in the analysed set. Both of their sessions ran
#    with the near-duplicate-course defect (see roles_data.py's docstring),
#    which is a content-quality question independent of counterbalancing --
#    the design itself now has room for both.
#  - Next 8 recruits should fill, in order of need: C->A->B (2),
#    A->C->B (2), C->B->A (2), B->A->C (2).

# --- ran under the original 9-slot design (historical, never change) ---
P1: [A, B, C]   # E1
P2: [B, C, A]   # E2
P3: [C, A, B]   # E3
P4: [A, B, C]   # E7
P7: [A, B, C]   # E13
P8: [B, C, A]   # E8

# --- scheduled, assigned the three previously-unused orders ---
P9: [A, C, B]   # E4
P10: [C, B, A]  # E5
P11: [B, A, C]  # E6

# --- withdrew, then returned; never ran, so nothing was frozen ---
P5: [B, C, A]   # E14

# --- dropped out before running; holds no slot ---
P6: [C, A, B]

# D0 is a demo persona, not part of the design -- its order is fixed to
# A -> B -> C because that's the sequence the original mid-fi mockups show
# (Main.dc.html = A, Graph.dc.html = B, Rules.dc.html = C).
D0: [A, B, C]
