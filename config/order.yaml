# Variant order per participant (A = natural language, B = graph,
# C = rule-based). Task assignment is by position: the 1st variant listed is
# shown with content set C1, the 2nd with C2, the 3rd with C3.
#
# ---------------------------------------------------------------------------
# Partial counterbalance (the original design) -- COMPLETE at 9
# ---------------------------------------------------------------------------
# Three cyclic rotations, 3 participants each. This is the design to report
# if the study stops here.
#
#   A -> B -> C   P1   (ran -- Consulting Director)
#                 P4   (ran -- LLM Engineer)
#                 P7   (ran -- Product Strategist)                CELL FULL
#   B -> C -> A   P2   (ran -- DevOps Engineer (AI Specialization))
#                 P8   (ran -- Senior Functional Consultant)
#                 P5   (scheduled -- Executive Director)          CELL FULL
#   C -> A -> B   P3   (ran -- Senior Marketing Manager)
#                 P10  (scheduled -- Monitoring and Evaluation Specialist)
#                 P12  (scheduled -- IT Head)                     CELL FULL
#
# 9 of 9 filled. Each variant appears in each position exactly 3 times, so
# position effects are balanced across the three rotations used.
#
# ---------------------------------------------------------------------------
# Full counterbalance (optional extension) -- 11 of 18
# ---------------------------------------------------------------------------
# Adds the three reverse orders, 3 participants each, for 18 total. The nine
# above keep their places; P9 and P11 already hold two of the extra slots.
#
#   A -> C -> B   P9   (scheduled -- Conservation Programme Manager)   1/3
#   C -> B -> A   (none)                                               0/3
#   B -> A -> C   P11  (scheduled -- People Manager)                   1/3
#
# 7 more recruits would be needed: A->C->B (2), C->B->A (3), B->A->C (2).
#
# ---------------------------------------------------------------------------
# Notes on individual participants
# ---------------------------------------------------------------------------
# P10 and P12 are scheduled together and were both assigned C -> A -> B,
# which is what completes the partial design. P10 previously held C -> B -> A
# and was reassigned before running, so nothing of theirs had been shown.
#
# P9 and P11 keep the reverse orders they were given, so they slot straight
# into the full counterbalance if the study extends. Neither has run.
#
# P5 withdrew before their session and later returned. Since they never ran,
# their order was never shown and nothing of theirs was frozen; keeping
# B -> C -> A completes that cell, and their course data was regenerated on
# the varied-filler structure.
#
# P6 dropped out before running and holds no slot. The entry below keeps the
# original (never-shown) order purely so the generator's output stays
# byte-identical for everyone else; P6 is excluded from both designs.
#
# The six participants who have already run (P1, P2, P3, P4, P7, P8) did so
# under the original design, so their orders are historical fact and must
# never change. All three of their rotations exist in both designs.
#
# ---------------------------------------------------------------------------
# Still open
# ---------------------------------------------------------------------------
#  - Whether P7 and P8 stay in the analysed set. Both of their sessions ran
#    with the near-duplicate-course defect (see roles_data.py's docstring),
#    which is a content-quality question independent of counterbalancing --
#    both designs have room for them.

# --- already ran (historical, never change) ---
P1: [A, B, C]
P2: [B, C, A]
P3: [C, A, B]
P4: [A, B, C]
P7: [A, B, C]
P8: [B, C, A]

# --- scheduled tomorrow; both assigned C -> A -> B, which completes the
#     partial counterbalance ---
P10: [C, A, B]
P12: [C, A, B]

# --- scheduled, holding two of the three extra orders the full
#     counterbalance would need ---
P9: [A, C, B]
P11: [B, A, C]

# --- withdrew, then returned; never ran, so nothing was frozen ---
P5: [B, C, A]

# --- dropped out before running; holds no slot ---
P6: [C, A, B]

# D0 is a demo persona, not part of the design -- its order is fixed to
# A -> B -> C because that's the sequence the original mid-fi mockups show
# (Main.dc.html = A, Graph.dc.html = B, Rules.dc.html = C).
D0: [A, B, C]
