# Target role per participant. role_title is the exact string shown in the
# prototype UI and used inside every wording template ("<role_title> job
# ads", "<role_title>s need..."). context_note is NOT shown to participants
# -- kept here only for traceability into scripts/roles_data.py.
#
# P1-P5 are real recruited participants, sourced from their prescreening
# questionnaire (mockups/prescreening.csv). role_title is each person's
# stated ASPIRATIONAL role (Q9: "what role are you working towards"), not
# their current job title (Q6) -- the study recommends courses toward a goal
# role, so that's the one shown as "the role you picked". See roles_data.py's
# module docstring for how each role's skills were derived from Q13/Q14.
#
# P6-P9 are reserved placeholder slots for 4 more participants not yet
# recruited -- their fictional profiles are unchanged from the original
# synthetic build, kept only so config/order.yaml's confirmed 9-slot Latin
# square stays balanced until those 4 are added.

P1:
  role_title: Consulting Director
  job_id: "job:consulting_director"
  context_note: "Currently a Consulting Technical Manager (ERP software, 8+ yrs); growing into AI-enabled consulting, executive leadership, strategic oversight. Avoid generic project-management-only content."

P2:
  role_title: "DevOps Engineer (AI Specialization)"
  job_id: "job:devops_engineer_ai"
  context_note: "Currently a DevOps Engineer (IT/electrical signal analysis, 8+ yrs; programming/scripting, AWS, CI/CD); growing into building AI agents, LLM integration, AI infrastructure design."

P3:
  role_title: Senior Marketing Manager
  job_id: "job:senior_marketing_manager"
  context_note: "Currently a Marketing Analytics Manager (hospitality, 8+ yrs; data analysis, customer profiling, presentation); growing into marketing business acumen, strategic thinking, systems thinking."

P4:
  role_title: LLM Engineer
  job_id: "job:llm_engineer"
  context_note: "Currently an Engineering Manager (IT/software, 8+ yrs; people/project management, technical systems acumen); growing into LLMOps, prompt engineering, fine-tuning -- a management-to-IC technical transition."

P5:
  role_title: Executive Director
  job_id: "job:executive_director_nonprofit"
  context_note: "Currently a Project Manager (nonprofit, 4-7 yrs; project management, leadership, communication); growing into project development, monitoring and evaluation, stakeholder management."

P6:
  role_title: HR Manager
  job_id: "job:hr_manager"
  context_note: "Human resource management and recruitment."

P7:
  role_title: Product Designer
  job_id: "job:product_designer"
  context_note: "Product and UX design. No retail-oriented content."

P8:
  role_title: Senior Software Engineer
  job_id: "job:senior_software_engineer"
  context_note: "Technical depth plus some leadership."

P9:
  role_title: Data Engineering Lead
  job_id: "job:data_engineering_lead"
  context_note: "Data engineering plus change management and coaching for leads; specific, not \"engineering in general\"."

D0:
  role_title: UX Designer
  job_id: "job:ux_designer"
  context_note: "Demo, not a participant. Must reproduce the strings in the mid-fi mockups. Exempt from the content-set rules in spec §5.4."

W0:
