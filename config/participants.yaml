# Target role per participant. role_title is the exact string shown in the
# prototype UI and used inside every wording template ("<role_title> job
# ads", "<role_title>s need..."). context_note is NOT shown to participants
# -- kept here only for traceability into scripts/roles_data.py.
#
# P1-P11 are all real recruited participants, sourced from their
# prescreening questionnaire (mockups/prescreening.csv) -- no fictional
# placeholder profiles remain. role_title is each person's stated
# ASPIRATIONAL role (Q9: "what role are you working towards"), not their
# current job title (Q6) -- the study recommends courses toward a goal role,
# so that's the one shown as "the role you picked". Several Q9 answers
# weren't usable as titles verbatim (a single word, a sentence of goals, a
# typo) and were cleaned; each such cleanup is recorded in that
# participant's context_note below. See roles_data.py's module docstring for
# how each role's skills were derived from Q13/Q14, and for the mandatory
# distinctness check every new entry must pass.
#
# Once a real recruit's data is generated it's frozen -- re-running the
# generator must never change an already-generated participant's content;
# only new recruits get added, into the next free P<n> slot. A respondent
# with no usable Q9/Q14 answer is skipped until corrected, never guessed at.
#
# P5 and P6 dropped out before running; see the note above their entries.
# config/order.yaml holds the E-slot counterbalance design (18 slots: all 6
# A/B/C orders x 3 participants each) and records which P<n> occupies which
# slot. 9 of 18 are filled, so 9 more recruits are needed.

P1:
  role_title: Consulting Director
  job_id: "job:consulting_director"
  context_note: "Currently a Consulting Technical Manager (ERP software, 8+ yrs); growing into AI-enabled consulting, executive leadership, strategic oversight. Avoid generic project-management-only content."

